name: Java tests
on:
  push:
    branches: [main, feat/implement-api-v1-get-post]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [room-service, reservation-service]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: filkom_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d filkom_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit and HTTP/database integration tests (PostgreSQL)
        run: mvn -B -pl ${{ matrix.service }} -am verify
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/filkom_test
          TEST_DB_USERNAME: test_user
          TEST_DB_PASSWORD: ci-only-password
          TEST_DB_DRIVER: org.postgresql.Driver
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.service }}
          path: '**/target/surefire-reports/'
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start two services and two PostgreSQL databases
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Exercise seven operations over real HTTP
        shell: bash
        run: |
          set -a
          source .env
          set +a
          python3 scripts/smoke.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
