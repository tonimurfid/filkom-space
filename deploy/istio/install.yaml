apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: default
  meshConfig:
    accessLogFile: /dev/stdout
  components:
    pilot:
      k8s:
        replicaCount: 1
        hpaSpec:
          minReplicas: 1
          maxReplicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
    ingressGateways:
    - name: istio-ingressgateway
      enabled: true
      k8s:
        replicaCount: 1
        hpaSpec:
          minReplicas: 1
          maxReplicas: 1
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        service:
          type: ClusterIP
