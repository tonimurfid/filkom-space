apiVersion: v1
kind: Service
metadata:
  name: room-db
  namespace: filkom-space
spec:
  clusterIP: None
  selector:
    app: room-db
  ports:
  - name: tcp-postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: room-db
  namespace: filkom-space
spec:
  serviceName: room-db
  replicas: 1
  selector:
    matchLabels:
      app: room-db
  template:
    metadata:
      labels:
        app: room-db
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      containers:
      - name: postgres
        image: postgres:17-alpine
        ports:
        - containerPort: 5432
          name: tcp-postgres
        env:
        - name: POSTGRES_DB
          value: room_db
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: filkom-secrets
              key: room-db-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: filkom-secrets
              key: room-db-password
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
---
