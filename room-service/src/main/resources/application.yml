server:
  port: 8081
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/room_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  admin-password: ${DEMO_ADMIN_PASSWORD}
  student-password: ${DEMO_STUDENT_PASSWORD}
  student-id: ${DEMO_STUDENT_ID:235150200111001}
  seed-data: ${SEED_DATA:false}
  room-service-url: ${ROOM_SERVICE_BASE_URL:http://localhost:8081}
  reservation-service-url: ${RESERVATION_SERVICE_BASE_URL:http://localhost:8082}
springdoc:
  swagger-ui:
    urls:
      - name: API v1
        url: /openapi.yaml
      - name: API v2
        url: /openapi-v2.yaml
    urls-primary-name: API v2
    disable-swagger-default-url: true
